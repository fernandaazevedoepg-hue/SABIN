name: Validacao do SABIN

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validacao-python:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verificar sintaxe de todos os ficheiros Python
        run: python -m compileall -q .
      - name: Instalar dependencias do projeto
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Executar testes unitarios
        run: python -m unittest discover -s tests -v

      - name: Testar importacao da aplicacao
        env:
          DATABASE_URL: postgresql+psycopg2://sabin:sabin@localhost:5432/sabin_test
        run: python -c "import app; print('Importacao da aplicacao concluida')"
